# Required checks for every PR (agents included). Branch rules block merging unless both pass.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Import check (gunicorn entry point)
        run: python -c "import flask_app; print(flask_app.app.url_map)"
  app:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.27.3", channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Android release build compiles (debug-signed)
        run: flutter build apk --release --build-number=${{ github.run_number }}
