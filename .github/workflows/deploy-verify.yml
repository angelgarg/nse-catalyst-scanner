# Render auto-deploys every push to main. This waits for the new commit to be live
# and healthy; if it never comes up, a revert PR + ops issue are opened automatically.
name: deploy-verify
on:
  push:
    branches: [main]
    paths: [flask_app.py, catalyst_core.py, requirements.txt, runtime.txt, Procfile, render.yaml, startup.py]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  verify:
    if: "!startsWith(github.event.head_commit.message, 'Revert')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Wait for Render to serve this commit
        id: wait
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s -m 60 https://nse-catalyst-scanner.onrender.com/api/health || true)
            echo "try $i: $body" | cut -c1-200
            if echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              curl -sf -m 60 https://nse-catalyst-scanner.onrender.com/api/stocks | head -c 200 && exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Open rollback PR
        if: failure() && steps.wait.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          # main requires green CI, so the revert goes through a PR. Render keeps the previous
          # healthy instance live meanwhile; the Ops agent pushes to this branch to run CI and merges.
          git config user.name "spikewise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b="rollback/${GITHUB_SHA::7}"
          git checkout -b "$b"
          git revert --no-edit "$GITHUB_SHA"
          git push origin "$b"
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$b" --label ops \
            --title "Rollback ${GITHUB_SHA::7}: Render deploy unhealthy" \
            --body "Commit $GITHUB_SHA did not become healthy on Render within 20 min. CI does not start on bot PRs: push an empty commit to this branch to run checks, then merge.")
          gh issue create --repo "$GITHUB_REPOSITORY" --label ops \
            --title "Render deploy of ${GITHUB_SHA::7} unhealthy: rollback PR open" \
            --body "Rollback PR: $pr. Check Render logs for the cause." || true
